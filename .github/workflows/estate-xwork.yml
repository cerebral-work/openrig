name: Estate xwork

# Estate verification (cargo xwork): governance gates, the xtask crate's own
# fmt/clippy/test, and the repo's npm gates (lint, test:repo, build:package). Fork-only; upstream workflows are untouched.

on:
  pull_request:
    branches: [cerebral]
  push:
    branches: [cerebral]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: estate-xwork-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xwork:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm ci
      # npm-test-workspaces is excluded on ubuntu: upstream's daemon/cli suites read macOS
      # process, inode and docker behaviour and upstream runs them on macos-latest
      # (tests.yml). Run `cargo xwork` locally for the full DAG.
      - run: cargo xwork --skip npm-test-workspaces
      # These launcher suites use fake tmux and hermetic fixture state, so they
      # run on Linux even though the full upstream workspace suite cannot.
      - name: Launcher regressions (CER-2889)
        run: >-
          npx vitest run --maxWorkers 2
          packages/daemon/test/fresh-shell-launch.test.ts
          packages/daemon/test/tmux-shell-command.test.ts
          packages/daemon/test/tmux-adapter.test.ts
          packages/daemon/test/tmux-argv-exec.test.ts
          packages/daemon/test/claude-runtime-adapter.test.ts
          packages/daemon/test/codex-runtime-adapter.test.ts
          packages/daemon/test/node-launcher.test.ts
          packages/daemon/test/seat-delivery-guard.test.ts
          packages/daemon/test/native-process-lineage.test.ts
          packages/daemon/test/claude-auto-startup.test.ts
          packages/daemon/test/startup-orchestrator.test.ts
      - name: Queue resolution and prompt guards
        run: >-
          npx vitest run --maxWorkers 2
          packages/daemon/test/queue-stuck-sweep.test.ts
          packages/daemon/test/queue-wake-ladder.test.ts
          packages/daemon/test/queue-recovery-read-work.test.ts
          packages/daemon/test/queue-recovery-index.test.ts
          packages/daemon/test/send-prompt-guard.test.ts
          packages/daemon/test/prompt-blocked-alert.test.ts
          packages/daemon/test/prompt-clear-continuation.test.ts
