name: Estate xwork

# Estate verification (cargo xwork): governance gates, the xtask crate's own
# fmt/clippy/test, and the repo's npm gates (lint, test:repo, build:package). Fork-only; upstream workflows are untouched.

# Never add pull_request_target or workflow_run triggers: they run as refs/heads/cerebral, would match the
# ent-parity workflow restriction, and could put fork-influenced code on the self-hosted pool (CER-2908).
on:
  pull_request:
    branches: [cerebral]
  push:
    branches: [cerebral]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: estate-xwork-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xwork:
    # A push to cerebral runs on ci-parity (CER-2908): the runner group serves only this workflow at
    # refs/heads/cerebral. Pull requests stay on ubuntu-latest: a PR run executes from its merge ref, which
    # the group never serves (it would wait for a runner indefinitely), and fork-PR code must not reach the
    # parity runner.
    runs-on: ${{ github.event_name == 'push' && fromJSON('{"group":"ent-parity","labels":["ci-parity"]}') || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - name: Egress policy probe (ci-parity CNP must deny these)
        if: github.event_name == 'push'
        shell: bash {0}
        run: |
          set -u
          # Positive control first: an allow-listed name must work, or a "deny" below proves nothing.
          code=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' https://api.github.com/zen) || { echo "::error::control api.github.com failed"; exit 1; }
          echo "control api.github.com -> HTTP $code"
          fail=0
          # -k: a TLS error must not pass for a block. A block is a drop (exit 28), a refusal (7) or a refused DNS name (6).
          for t in https://10.0.0.13:6443/version \
                   https://10.96.0.1:443/version \
                   https://10.0.0.100:6443/version \
                   http://169.254.169.254/v1.json \
                   http://100.100.100.100/ \
                   https://kubernetes.default.svc.cluster.local/version \
                   https://example.com/; do
            curl -ksS --max-time 8 -o /dev/null "$t" 2>/dev/null; rc=$?
            case $rc in
              6|7|28) echo "blocked ($rc): $t" ;;
              *) echo "::error::NOT blocked (curl exit $rc): $t"; fail=1 ;;
            esac
          done
          exit $fail
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: |
          command -v tmux >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y tmux; }
          tmux -V
      - run: npm ci
      # npm-test-workspaces is excluded on ubuntu: upstream's daemon/cli suites read macOS
      # process, inode and docker behaviour and upstream runs them on macos-latest
      # (tests.yml). Run `cargo xwork` locally for the full DAG.
      - run: cargo xwork --skip npm-test-workspaces
      # These launcher suites use fake tmux and hermetic fixture state, so they
      # run on Linux even though the full upstream workspace suite cannot.
      - name: Launcher regressions (CER-2889)
        run: >-
          npx vitest run --maxWorkers 2
          packages/daemon/test/fresh-shell-launch.test.ts
          packages/daemon/test/fresh-shell-pane-mode.test.ts
          packages/daemon/test/tmux-shell-command.test.ts
          packages/daemon/test/tmux-adapter.test.ts
          packages/daemon/test/tmux-argv-exec.test.ts
          packages/daemon/test/claude-runtime-adapter.test.ts
          packages/daemon/test/codex-runtime-adapter.test.ts
          packages/daemon/test/node-launcher.test.ts
          packages/daemon/test/seat-delivery-guard.test.ts
          packages/daemon/test/native-process-lineage.test.ts
          packages/daemon/test/claude-auto-startup.test.ts
          packages/daemon/test/startup-orchestrator.test.ts
      - name: Queue resolution and prompt guards
        run: >-
          npx vitest run --maxWorkers 2
          packages/daemon/test/queue-stuck-sweep.test.ts
          packages/daemon/test/queue-wake-ladder.test.ts
          packages/daemon/test/queue-recovery-read-work.test.ts
          packages/daemon/test/queue-recovery-index.test.ts
          packages/daemon/test/send-prompt-guard.test.ts
          packages/daemon/test/prompt-blocked-alert.test.ts
          packages/daemon/test/prompt-clear-continuation.test.ts
      # A private tmux server whose global environment carries a herdr pane's identity.
      - name: Seat launch environment (HERDR_* filter)
        run: >-
          npx vitest run --maxWorkers 2
          packages/daemon/test/seat-launch-env-filter.test.ts
          packages/daemon/test/seat-launch-env-tmux.test.ts
          packages/daemon/test/parent-session-env.test.ts
          packages/daemon/test/tmux-argv-legacy-equivalence.test.ts
